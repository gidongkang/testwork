
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f5f6fa;
            color: #222;
            line-height: 1.7;
        }

        header {
            background: #222831;
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            color: #cbd5e1;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: white;
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        h2 {
            margin-bottom: 15px;
            color: #222831;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>안녕하세요! 👋</h1>
        <p>나만의 개인 홈페이지입니다.</p>
    </header>

    <main>
        <section>
            <h2>🙋 About Me</h2>
            <p>
                안녕하세요. 저를 소개하는 공간입니다.<br>
                관심 있는 분야와 간단한 자기소개를 작성해 보세요.
            </p>
        </section>

        <section>
            <h2>💡 My Interests</h2>
            <p>
                개발 · IT · 여행 · 음악 · 일상
            </p>
        </section>

        <section>
            <h2>🚀 My Projects</h2>
            <p>
                진행했던 프로젝트나 작업물을 소개하는 공간입니다.
            </p>
        </section>

        <section>
            <h2>📧 Contact</h2>
            <p>
                Email: <a href="mailto:hello@example.com">
                    hello@example.com
                </a>
            </p>
            <p>
                GitHub: <a href="https://github.com/">
                    GitHub 방문하기
                </a>
            </p>
        </section>

    <footer>
        © 2026 My Personal Website. All rights reserved.
    </footer>

</body>
</html>
